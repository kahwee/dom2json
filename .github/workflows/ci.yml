name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # npm test owns the build; the other checks do not emit files.
      - parallel:
          - name: Type check
            run: npm run typecheck
          - name: Lint
            run: npm run lint
          - name: Build and test
            run: npm test
